<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; font: 14px -apple-system, "Segoe UI", Arial, sans-serif; padding: 10px; }
  h3 { margin: 0 0 8px; color: #0b57d0; }
  label { display: block; margin: 6px 0; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 8px; }
  #out { margin-top: 8px; font-size: 13px; }
  .pos { color: #b3261e; font-weight: 600; margin-top: 4px; }
</style>
</head>
<body>
  <h3>EnVi Dictionary</h3>
  <label><input type="checkbox" id="enabled"> Bật tra từ trên trang</label>
  <label><input type="radio" name="mode" value="altdbl"> Giữ Alt + nhấp đúp</label>
  <label><input type="radio" name="mode" value="dblclick"> Nhấp đúp vào từ</label>
  <label><input type="radio" name="mode" value="select"> Bôi đen bất kỳ</label>
  <input type="text" id="q" placeholder="Nhập từ tiếng Anh rồi Enter">
  <div id="out"></div>
  <script src="popup.js"></script>
</body>
</html>
